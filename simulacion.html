<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"

    <title>Simulación de Realidad Virtual</title>

    <link rel="stylesheet" href="css/style.css">

        html,
        body {

    }
}

            src="js/simulacion.js"></script>
